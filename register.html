<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Snakes Adventure</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/register.css" />
</head>
<body class="page-auth">

  <main class="auth">
    <!-- Panel kiri: ilustrasi -->
    <aside class="auth__side" aria-hidden="true">
      <a href="index.html"><img class="auth__logo" src="assets/images/logo.png" alt="" width="920" height="949" decoding="sync" /></a>
      <p>Buat akun gratis dan mulai petualangan ular tanggamu!</p>
      <img class="auth__deco auth__deco--snake" src="assets/images/snakes/snake-green.png" alt="" />
      <img class="auth__deco auth__deco--ladder" src="assets/images/ladders/ladder-wood.png" alt="" />
    </aside>

    <!-- Panel kanan: form -->
    <section class="auth__panel card">
      <a class="auth__back" href="index.html">← Kembali ke Home</a>
      <h1>Buat <span class="text-gold">Akun</span></h1>
      <p class="text-muted">Daftar untuk menyimpan skor dan riwayat permainanmu.</p>

      <div id="formAlert" class="alert alert--error hidden" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username"
                 placeholder="mis. ular_pemberani" maxlength="16" required />
          <p class="field__error" id="usernameError"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password"
                   placeholder="Minimal 6 karakter" required />
            <button class="input-toggle" type="button" data-toggle-password="password" aria-pressed="false">Lihat</button>
          </div>
          <div class="strength" aria-hidden="true"><span id="strengthBar"></span></div>
          <p class="field__hint" id="strengthText">Gunakan kombinasi huruf, angka, dan simbol.</p>
          <p class="field__error" id="passwordError"></p>
        </div>

        <div class="field">
          <label for="confirm">Konfirmasi Password</label>
          <div class="input-wrap">
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password"
                   placeholder="Ulangi password" required />
            <button class="input-toggle" type="button" data-toggle-password="confirm" aria-pressed="false">Lihat</button>
          </div>
          <p class="field__error" id="confirmError"></p>
        </div>

        <button class="btn btn--gold btn--lg btn--block" type="submit">Daftar</button>
      </form>

      <p class="auth__switch">Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
