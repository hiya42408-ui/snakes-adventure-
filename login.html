<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Snakes Adventure</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="page-auth">

  <main class="auth">
    <!-- Panel kiri: ilustrasi -->
    <aside class="auth__side" aria-hidden="true">
      <a href="index.html"><img class="auth__logo" src="assets/images/logo.png" alt="" width="920" height="949" decoding="sync" /></a>
      <p>Selamat datang kembali! Papan permainan sudah menunggumu.</p>
      <img class="auth__deco auth__deco--snake" src="assets/images/snakes/snake-red.png" alt="" />
      <img class="auth__deco auth__deco--ladder" src="assets/images/ladders/ladder-orange.png" alt="" />
    </aside>

    <!-- Panel kanan: form -->
    <section class="auth__panel card">
      <a class="auth__back" href="index.html">← Kembali ke Home</a>
      <h1>Masuk <span class="text-gold">Akun</span></h1>
      <p class="text-muted">Login untuk melanjutkan permainanmu.</p>

      <div id="formAlert" class="alert alert--error hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" type="text" autocomplete="username"
                 placeholder="Username kamu" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="Password kamu" required />
            <button class="input-toggle" type="button" data-toggle-password="password" aria-pressed="false">Lihat</button>
          </div>
        </div>

        <button class="btn btn--gold btn--lg btn--block" type="submit" id="submitBtn">Login</button>
      </form>

      <p class="auth__switch">Belum punya akun? <a href="register.html">Register di sini</a></p>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
